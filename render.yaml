# Render blueprint for the backend API (https://render.com/docs/blueprint-spec).
# The frontend is deployed separately on Vercel (see README "Deployment").
services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"
